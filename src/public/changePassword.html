<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Auth App</title>
</head>

<body>
  <h1>Change your password</h1>
  <div class="profile_infrmation">
    <form class="profile_form" action="/changePassword" method="POST">
      <p>Old Password:</p>
      <input name="oldPassword" placeholder="password" required>
      <p>New password:</p>
      <input name="newPassword" placeholder="password" required>
      <button class="button_change" type="submit">Change</button>
    </form>
  </div>
</body>

</html>
