<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Auth App</title>
</head>

<body>
  <h1>Change your password</h1>
  <div class="profile_infrmation">
    <form class="profile_form" action="/changePassword" method="POST">
      <p>Old Password:</p>
      <input 
      type="password" 
      name="oldPassword" 
      placeholder="password"
      minlength="6" 
      required>
      <small>Password must be at least 6 characters long.</small>
      <p>New password:</p>
      <input 
      type="password" 
      name="newPassword" 
      placeholder="password"
      minlength="6" 
      required>
      <small>Password must be at least 6 characters long.</small>
      <p>Confirm password:</p>
      <input 
      type="password" 
      name="confirmation" 
      placeholder="confirm password"
      minlength="6"
      required>
      <small>Password must be at least 6 characters long.</small>
      <button class="button_change" type="submit">Change</button>
    </form>
  </div>
</body>

</html>
