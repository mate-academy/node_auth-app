<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Auth App</title>
</head>

<body>
  <h1>Enter your new password</h1>
  <div class="profile_infrmation">
    <form class="profile_form" action="/reset/{{token}}" method="POST">
      <p>New Password:</p>
      <input type="password" name="newPassword" placeholder="password" minlength="6" required>
      <p>Confirm password:</p>
      <input type="password" name="confirmation" placeholder="password" minlength="6" required>
      <button class="button_change" type="submit">Confirm</button>
    </form>
  </div>
</body>

</html>
