<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вхід</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="card">
      <h1>Вхід</h1>

      <form id="loginForm" class="form-row">
        <div>
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required autocomplete="email" />
        </div>
        <div>
          <label for="loginPassword">Пароль</label>
          <input
            type="password"
            id="loginPassword"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn">Увійти</button>
        <div class="btn-helpers">
          <a class="btn passport" href="http://localhost:3005/auth/google"
            >Увійти за допомогою Google <br />
            <br />
            <svg width="20" height="20" viewBox="0 0 48 48">
              <path
                fill="#FFC107"
                d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
              />
              <path
                fill="#FF3D00"
                d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
              />
              <path
                fill="#4CAF50"
                d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
              />
              <path
                fill="#1976D2"
                d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
              />
            </svg>
          </a>
          <a class="btn passport" href="http://localhost:3005/auth/github"
            >Увійти за допомогою GitHub <br />
            <br />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0C5.373 0 0 5.373 0 12c0 5.303 3.438 9.8 8.207 11.387.6.113.793-.26.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.5 11.5 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"
              />
            </svg>
          </a>
          <a class="btn passport" href="http://localhost:3005/auth/facebook"
            >Увійти за допомогою FaceBook <br />
            <br />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
          </a>
        </div>
        <p class="notice">
          <a href="#" id="showForgotPasswordLink">Забули пароль?</a>
        </p>
        <p class="notice">
          Немає акаунта? <a href="/pages/register.html">Зареєструватись</a>
        </p>
      </form>

      <form id="forgotPasswordForm" class="form-row" hidden>
        <div>
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" required autocomplete="email" />
        </div>
        <button type="submit" class="btn">
          Надіслати лист для відновлення
        </button>
        <p class="notice">
          <a href="#" id="backToLoginFromForgot">Повернутися до входу</a>
        </p>
      </form>

      <div id="authMessage" class="message"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/dom.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
