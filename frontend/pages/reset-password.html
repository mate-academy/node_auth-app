<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Новий пароль</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<div class="card">
  <h1>Новий пароль</h1>

  <form id="resetPasswordForm" class="form-row">
    <div>
      <label for="resetPasswordInput">Новий пароль</label>
      <input type="password" id="resetPasswordInput" required autocomplete="new-password" />
    </div>
    <div>
      <label for="resetConfirmPasswordInput">Підтвердіть новий пароль</label>
      <input type="password" id="resetConfirmPasswordInput" required autocomplete="new-password" />
    </div>
    <button type="submit" class="btn">Змінити пароль</button>
  </form>

  <div id="resetPasswordMessage" class="message"></div>
  <p class="notice"><a href="/pages/login.html">Повернутися до входу</a></p>
</div>

<script src="/js/api.js"></script>
<script src="/js/dom.js"></script>
<script src="/js/main.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
