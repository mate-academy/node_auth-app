<mat-card>
  <mat-card-header>
    <mat-card-title>Page not found</mat-card-title>
    <mat-card-subtitle>404</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>
      There's no page at <code>{{ url }}</code>.
      Check the address or go back to the home page.
    </p>
  </mat-card-content>

  <mat-card-actions>
    <a mat-flat-button color="primary" routerLink="/">Go home</a>
  </mat-card-actions>
</mat-card>
