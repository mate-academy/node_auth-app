<mat-card class="section">
  <mat-card-header>
    <mat-card-title>Name</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" autocomplete="name" />
        @if (form.controls.name.hasError('required')) {
        <mat-error>Name is required</mat-error>
        } @else if (form.controls.name.hasError('minlength')) {
        <mat-error>At least 2 characters</mat-error>
        } @else if (form.controls.name.hasError('server')) {
        <mat-error>{{ form.controls.name.getError('server') }}</mat-error>
        }
      </mat-form-field>

      @if (generalError()) {
      <p class="form-error">{{ generalError() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading() || form.pristine">
        {{ loading() ? 'Saving…' : 'Save name' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
