<mat-card>
  <mat-card-header>
    <mat-card-title>Password changed</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>Your password has been updated. You can now log in with your new password.</p>
    <p>For security, you were logged out on all devices.</p>
  </mat-card-content>

  <mat-card-actions>
    <a mat-flat-button color="primary" routerLink="/login">Go to login</a>
  </mat-card-actions>
</mat-card>
